<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room for a Thought — Illustration Maker</title>
<meta name="description" content="Make a little illustrated scene with stickers and text messages.">
<link rel="stylesheet" href="style.css?v=canvas-ratios">
<script src="editor.js?v=canvas-ratios" defer></script>
</head>
<body>
<main>
<section id="room-window" class="app-window" aria-labelledby="room-title">
<div class="window-bar" role="group" aria-label="Room for a Thought title bar">
  <img src="/explorer/icons/paint-v1.webp" width="22" height="22" alt="">
  <h1 id="room-title">Room for a Thought</h1>
  <div class="window-controls">
    <button type="button" id="minimize-window" aria-label="Minimize Room for a Thought"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
    <button type="button" id="maximize-window" aria-label="Maximize Room for a Thought"><svg width="11" height="11" viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="2"/></svg></button>
    <a href="/explore" aria-label="Close Room for a Thought"><svg width="13" height="13" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 6-12 12M6 6l12 12"/></svg></a>
  </div>
</div>
<a class="back-to-explorer" href="/explore">← &nbsp; Back to Explorer</a>
<div class="toolbar">
  <button id="undo" class="plain" disabled>↶ &nbsp; Undo</button>
  <div class="canvas-size">
    <label for="canvas-ratio">Canvas</label>
    <select id="canvas-ratio">
      <option value="4:3">Original · 4:3</option>
      <option value="16:9">Landscape · 16:9</option>
      <option value="1:1">Square · 1:1</option>
      <option value="4:5">Portrait · 4:5</option>
      <option value="9:16">Story · 9:16</option>
    </select>
  </div>
  <div class="export">
    <label class="sr-only" for="format">Image format</label>
    <select id="format"><option value="jpeg">JPEG</option><option value="png">PNG</option></select>
    <button id="download" class="primary">Download</button>
  </div>
</div>
<div class="studio">
  <section class="artwork" aria-label="Illustration editor">
    <div class="art-heading"><strong><span aria-hidden="true">✦</span> &nbsp; <span id="scene-name">The night room</span></strong><span id="scene-size">960 × 720</span></div>
    <canvas id="scene" width="960" height="720" tabindex="0" aria-label="Composition canvas. Select items on the canvas or from Layers. Use the arrow keys to move a selection."></canvas>

  </section>
  <aside aria-label="Editing tools">
    <section class="panel">
      <h2>Illustration</h2>
      <label for="background-file">Choose your own image</label>
      <input id="background-file" type="file" accept="image/jpeg,image/png,image/webp">
      <p class="image-hint">Stays on your device. Center-cropped to fill the canvas, never stretched.</p>
      <p id="background-error" class="error" role="alert" hidden></p>
      <button id="reset-background" type="button" disabled>Restore night room</button>
    </section>
    <section class="panel">
      <h2><span aria-hidden="true">✎</span> Message</h2>
      <label for="message" class="sr-only">Message text</label>
      <textarea id="message" rows="2" maxlength="360" placeholder="What’s on your mind?"></textarea>
      <fieldset>
        <legend class="sr-only">Bubble style</legend>
        <label><input type="radio" name="style" value="sent" checked><span><i></i> Sent</span></label>
        <label><input type="radio" name="style" value="received"><span><i></i> Received</span></label>
      </fieldset>
      <p id="message-error" class="error" role="alert" hidden></p>
      <button id="update" class="add" hidden>Update selected message</button>
      <button id="add" class="add">＋ &nbsp; Add message</button>
    </section>
    <section class="panel">
      <h2><span aria-hidden="true">✦</span> Stickers</h2>
      <div id="stickers" class="stickers"></div>
    </section>
    <section class="panel">
      <h2><span aria-hidden="true">▱</span> Layers</h2>
      <div id="layers" class="layers" aria-label="Layers, topmost first"></div>
      <div class="actions">
        <button id="forward" aria-label="Move layer forward" title="Move forward">↑</button>
        <button id="back" aria-label="Move layer backward" title="Move backward">↓</button>
        <button id="remove">Delete</button>
      </div>
    </section>
  </aside>
</div>
<footer class="window-status"><span>Drag pieces to make the room yours.</span><span>made on michelle’s computer</span></footer>
</section>
<div class="taskbar" role="toolbar" aria-label="Desktop controls">
  <a href="/explore"><img src="/explorer/icons/folder-v1.webp" width="22" height="22" alt=""> Explore</a>
  <button type="button" id="restore-window" aria-pressed="true" aria-label="Restore Room for a Thought"><img src="/explorer/icons/paint-v1.webp" width="20" height="20" alt=""> Room for a Thought</button>
</div>
<p id="status" role="status" class="sr-only"></p>
</main>
</body>
</html>
